name: Build and Upload iOS (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS and Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          architecture: x64
          channel: stable

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Decode and install certificate
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          python - <<'PY'
          import os, base64
          with open("cert.p12", "wb") as f:
              f.write(base64.b64decode(os.environ["CERT_P12"]))
          PY
          security import cert.p12 -P "$CERT_P12_PASSWORD" -A
          security find-identity -v -p codesigning

      - name: Decode and install provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python - <<'PY'
          import os, base64
          with open("profile.mobileprovision", "wb") as f:
              f.write(base64.b64decode(os.environ["PROVISIONING_PROFILE"]))
          PY
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i profile.mobileprovision > profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' profile.plist)
          APPLICATION_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' profile.plist)
          EXPECTED_APPLICATION_IDENTIFIER="${APPLE_TEAM_ID}.com.jaes.app"
          if [ "$APPLICATION_IDENTIFIER" != "$EXPECTED_APPLICATION_IDENTIFIER" ]; then
            echo "Provisioning profile application identifier is '$APPLICATION_IDENTIFIER', expected '$EXPECTED_APPLICATION_IDENTIFIER'"
            exit 1
          fi
          GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' profile.plist 2>/dev/null || true)
          if [ "$GET_TASK_ALLOW" = "true" ] || /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' profile.plist >/dev/null 2>&1; then
            echo "The provisioning profile is a development profile; a distribution profile is required for TestFlight"
            exit 1
          fi
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          {
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
          } >> "$GITHUB_ENV"

      - name: Create ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}"
          : "${PROFILE_NAME:?PROFILE_NAME is required}"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>method</key>' \
            '  <string>app-store</string>' \
            '  <key>signingStyle</key>' \
            '  <string>manual</string>' \
            '  <key>teamID</key>' \
            "  <string>${APPLE_TEAM_ID}</string>" \
            '  <key>provisioningProfiles</key>' \
            '  <dict>' \
            '    <key>com.jaes.app</key>' \
            "    <string>${PROFILE_NAME}</string>" \
            '  </dict>' \
            '  <key>uploadBitcode</key>' \
            '  <false/>' \
            '  <key>compileBitcode</key>' \
            '  <false/>' \
            '</dict>' \
            '</plist>' > ExportOptions.plist
          plutil -lint ExportOptions.plist
          echo "Created ExportOptions.plist for profile: ${PROFILE_NAME}"

      - name: Build IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          flutter build ios --release --no-codesign
          python3 - "$PROFILE_UUID" "$APPLE_TEAM_ID" <<'PY'
          import re
          import sys
          from pathlib import Path

          project_path = Path("ios/Runner.xcodeproj/project.pbxproj")
          project = project_path.read_text()
          profile_uuid, team_id = sys.argv[1:]
          marker = "97C147071CF9000F007C117D /* Release */ = {"
          start = project.index(marker)
          settings_start = project.index("buildSettings = {", start)
          settings_end = project.index("\n\t\t\t};", settings_start)
          settings = project[settings_start:settings_end]
          settings = re.sub(r"\n\s*CODE_SIGN_STYLE = [^;]+;", "", settings)
          settings = re.sub(r"\n\s*CODE_SIGN_IDENTITY = [^;]+;", "", settings)
          settings = re.sub(r"\n\s*PROVISIONING_PROFILE_SPECIFIER = [^;]+;", "", settings)
          settings += (
              f'\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
              f'\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";'
              f'\n\t\t\t\tDEVELOPMENT_TEAM = {team_id};'
              f'\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = {profile_uuid};'
          )
          project_path.write_text(project[:settings_start] + settings + project[settings_end:])
          PY
          mkdir -p build/ios/ipa
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ExportOptions.plist
          find build/ios -maxdepth 3 \( -name '*.xcarchive' -o -name '*.ipa' \) -print

      - name: Prepare App Store Connect API key JSON
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os, base64, json
          key_b64 = os.environ.get("APP_STORE_CONNECT_PRIVATE_KEY", "")
          if key_b64.strip() == "" or key_b64.strip() == "null":
              raise SystemExit("Missing APP_STORE_CONNECT_PRIVATE_KEY secret")
          key = base64.b64decode(key_b64).decode("utf-8")
          obj = {
              "key_id": os.environ["APP_STORE_CONNECT_KEY_ID"],
              "issuer_id": os.environ["APP_STORE_CONNECT_ISSUER_ID"],
              "key": key,
          }
          with open("api_key.json", "w") as f:
              json.dump(obj, f)
          PY

      - name: Install fastlane
        run: |
          gem install fastlane -v 2.226.0

      - name: Upload to TestFlight (fastlane pilot)
        run: |
          ls -la build/ios/ipa || true
          fastlane pilot upload -i build/ios/ipa/*.ipa --api_key_path api_key.json

      - name: Upload artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
