name: Build and Upload iOS (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build iOS and Upload to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          architecture: x64
          channel: stable

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Decode and install certificate
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          python - <<'PY'
          import os, base64
          with open("cert.p12", "wb") as f:
              f.write(base64.b64decode(os.environ["CERT_P12"]))
          PY
          security import cert.p12 -P "$CERT_P12_PASSWORD" -A
          security find-identity -v -p codesigning

      - name: Decode and install provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          python - <<'PY'
          import os, base64
          with open("profile.mobileprovision", "wb") as f:
              f.write(base64.b64decode(os.environ["PROVISIONING_PROFILE"]))
          PY
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Create ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        run: |
          flutter build ipa --export-options-plist=ExportOptions.plist
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ExportOptions.plist
          find build/ios -maxdepth 3 \( -name '*.xcarchive' -o -name '*.ipa' \) -print

      - name: Prepare App Store Connect API key JSON
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os, base64, json
          key_b64 = os.environ.get("APP_STORE_CONNECT_PRIVATE_KEY", "")
          if key_b64.strip() == "" or key_b64.strip() == "null":
              raise SystemExit("Missing APP_STORE_CONNECT_PRIVATE_KEY secret")
          key = base64.b64decode(key_b64).decode("utf-8")
          obj = {
              "key_id": os.environ["APP_STORE_CONNECT_KEY_ID"],
              "issuer_id": os.environ["APP_STORE_CONNECT_ISSUER_ID"],
              "key": key,
          }
          with open("api_key.json", "w") as f:
              json.dump(obj, f)
          PY

      - name: Install fastlane
        run: |
          gem install fastlane -v 2.226.0

      - name: Upload to TestFlight (fastlane pilot)
        run: |
          ls -la build/ios/ipa || true
          fastlane pilot upload -i build/ios/ipa/*.ipa --api_key_path api_key.json

      - name: Upload artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
