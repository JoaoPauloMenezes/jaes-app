name: App Store Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Boot iPhone 6.5" simulator (1284x2778)
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes available | grep -E "^iOS " | tail -1 | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+')
          # iPhone 14 Plus renders at 1284x2778, one of the sizes App Store Connect accepts.
          UDID=$(xcrun simctl create "Screenshots 14 Plus" "com.apple.CoreSimulator.SimDeviceType.iPhone-14-Plus" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Capture screenshots
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/screenshots_test.dart \
            -d "$SIM_UDID"
          sips -g pixelWidth -g pixelHeight screenshots/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: screenshots/*.png
