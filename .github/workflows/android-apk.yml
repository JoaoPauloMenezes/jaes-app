name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          set -euo pipefail
          cat > android/local.properties <<EOF
          flutter.sdk=$FLUTTER_ROOT
          sdk.dir=$ANDROID_HOME
          flutter.buildMode=release
          EOF
          flutter pub get

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          rm -f android/key.properties
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && \
             [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${ANDROID_KEY_PASSWORD:-}" ] && \
             [ -n "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jaes-release.keystore"
            cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/jaes-release.keystore
          EOF
            echo "Release signing configured"
          else
            echo "Release signing secrets are not configured; the Gradle build will use its debug signing fallback"
          fi

      - name: Build APK
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "JAES-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaes-android-apk-${{ github.run_number }}
          path: JAES-*.apk
          if-no-files-found: error
          retention-days: 14
