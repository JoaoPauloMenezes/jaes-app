name: Build iOS Ad Hoc (.ipa)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Ad Hoc IPA
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          architecture: x64
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Install distribution certificate
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERT_P12:?CERT_P12 is required}"
          : "${CERT_P12_PASSWORD:?CERT_P12_PASSWORD is required}"
          KEYCHAIN_PATH="$RUNNER_TEMP/build-signing.keychain-db"
          security create-keychain -p "$CERT_P12_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$CERT_P12_PASSWORD" "$KEYCHAIN_PATH"
          python3 - <<'PY'
          import base64, os
          with open("cert.p12", "wb") as file:
              file.write(base64.b64decode(os.environ["CERT_P12"]))
          PY
          security import cert.p12 -k "$KEYCHAIN_PATH" -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$CERT_P12_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Install Ad Hoc provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.AD_HOC_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${PROVISIONING_PROFILE:?AD_HOC_PROVISIONING_PROFILE is required}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}"
          python3 - <<'PY'
          import base64, os
          with open("profile.mobileprovision", "wb") as file:
              file.write(base64.b64decode(os.environ["PROVISIONING_PROFILE"]))
          PY
          security cms -D -i profile.mobileprovision > profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' profile.plist)
          APPLICATION_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' profile.plist)
          EXPECTED_APPLICATION_IDENTIFIER="${APPLE_TEAM_ID}.com.jaes.app"
          if [ "$APPLICATION_IDENTIFIER" != "$EXPECTED_APPLICATION_IDENTIFIER" ]; then
            echo "Provisioning profile application identifier is '$APPLICATION_IDENTIFIER', expected '$EXPECTED_APPLICATION_IDENTIFIER'"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' profile.plist >/dev/null
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          {
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
          } >> "$GITHUB_ENV"

      - name: Prepare Flutter iOS build
        run: flutter build ios --release --no-codesign --build-number "$GITHUB_RUN_NUMBER"

      - name: Configure manual signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - "$PROFILE_UUID" "$APPLE_TEAM_ID" <<'PY'
          import re
          import sys
          from pathlib import Path

          project_path = Path("ios/Runner.xcodeproj/project.pbxproj")
          project = project_path.read_text()
          profile_uuid, team_id = sys.argv[1:]
          marker = "97C147071CF9000F007C117D /* Release */ = {"
          start = project.index(marker)
          settings_start = project.index("buildSettings = {", start)
          settings_end = project.index("\n\t\t\t};", settings_start)
          settings = project[settings_start:settings_end]
          settings = re.sub(r"\n\s*CODE_SIGN_STYLE = [^;]+;", "", settings)
          settings = re.sub(r"\n\s*CODE_SIGN_IDENTITY = [^;]+;", "", settings)
          settings = re.sub(r"\n\s*PROVISIONING_PROFILE_SPECIFIER = [^;]+;", "", settings)
          settings += (
              f'\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
              f'\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";'
              f'\n\t\t\t\tDEVELOPMENT_TEAM = {team_id};'
              f'\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = {profile_uuid};'
          )
          project_path.write_text(project[:settings_start] + settings + project[settings_end:])
          PY

      - name: Archive iOS app
        run: |
          set -euo pipefail
          mkdir -p build/ios/ipa
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive

      - name: Create Ad Hoc export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>method</key><string>ad-hoc</string>' \
            '<key>signingStyle</key><string>manual</string>' \
            "<key>teamID</key><string>${APPLE_TEAM_ID}</string>" \
            '<key>provisioningProfiles</key><dict>' \
            '<key>com.jaes.app</key>' \
            "<string>${PROFILE_NAME}</string>" \
            '</dict></dict></plist>' > ExportOptions.plist
          plutil -lint ExportOptions.plist

      - name: Export Ad Hoc IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload Ad Hoc IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-adhoc-ipa
          path: build/ios/ipa/*.ipa